[project]
name = "basic-infrastructure-system"
version = "0.1.0"
description = "Discord infrastructure management system"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
]

[tool.uv.workspace]
members = [
  "DiscordConnector/DiscordController",
  "DiscordConnector/ControlInterface",
  "DiscordConnector/DiscordDatabaseController",
  "DiscordConnector/PublicAPI",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "DiscordConnector/tests",
    "DiscordConnector/DiscordDatabaseController/tests",
    "DiscordConnector/DiscordController/tests",
    "DiscordConnector/ControlInterface/tests",
    "DiscordConnector/PublicAPI/tests",
]
