[project]
name = "discord-connector-control-interface"
version = "0.1.0"
description = "HTTP API interface for Discord Controller"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "discord-controller-discord",
    "discord-database-controller",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.uv.sources]
discord-controller-discord = { workspace = true }
discord-database-controller = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
