[project]
name = "discord-database-controller"
version = "0.1.0"
description = "Database controller for Discord server state management"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools]
py-modules = ["interface", "schemas", "models", "controller", "mock_controller", "database"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
