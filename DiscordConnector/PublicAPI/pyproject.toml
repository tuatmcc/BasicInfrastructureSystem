[project]
name = "discord-connector-public-api"
version = "0.1.0"
description = "Public HTTP API for Discord Connector"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "PyJWT[crypto]>=2.10.0",
    "uvicorn>=0.34.0",
    "discord-connector-control-interface",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.uv.sources]
discord-connector-control-interface = { workspace = true }

[tool.setuptools.packages.find]
include = ["api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
